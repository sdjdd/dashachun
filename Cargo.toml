[package]
name = "xiaozhi-server-rs"
version = "0.1.0"
edition = "2024"

[dependencies]
async-openai = { version = "0.42", default-features = false, features = ["rustls", "chat-completion"] }
axum = { version = "0.8.9", features = ["ws", "macros"] }
dotenvy = "0.15.7"
flate2 = "1.1"
futures-util = { version = "0.3", default-features = false, features = ["std", "sink"] }
opus = "0.4"
voice_activity_detector = "0.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["full"] }
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-native-roots"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["normalize-path"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
