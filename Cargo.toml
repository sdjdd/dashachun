[package]
name = "dashachun"
version = "0.1.0"
edition = "2024"

[dependencies]
arc-swap = "1"
argon2 = "0.5"
async-openai = { version = "0.42", default-features = false, features = ["rustls", "chat-completion"] }
async-trait = "0.1"
aws-sdk-s3 = { version = "1.152", default-features = false, features = ["rt-tokio", "http-1x", "default-https-client"] }
axum = { version = "0.8.9", features = ["ws", "macros"] }
axum-extra = { version = "0.10", features = ["cookie", "cookie-signed"] }
dotenvy = "0.15.7"
eyre = "0.6"
flacenc = { version = "0.5", default-features = false }
flate2 = "1.1"
futures-util = { version = "0.3", default-features = false, features = ["std", "sink"] }
garde = { version = "0.23", features = ["derive", "regex"] }
knf-rs = "0.3.2"
minijinja = "3"
ndarray = "0.16"
opus = "0.4"
# pinned rc.10; a bump to rc.13+ first needs the voiceprint knf-rs ndarray
# shim — see src/voiceprint/README.md before touching this
ort = { version = "=2.0.0-rc.10", features = ["ndarray"] }
rand = "0.9"
redis = { version = "1", default-features = false, features = ["tokio-comp", "script"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls-aws-lc-rs", "postgres", "uuid", "time", "migrate", "macros", "json"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.10"
thiserror = "2"
time = { version = "0.3", features = ["serde-well-known"] }
tokio = { version = "1.53.1", features = ["full"] }
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-native-roots"] }
tokio-util = { version = "0.7", default-features = false }
tower = "0.5"
tower-http = { version = "0.6", features = ["normalize-path"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }
utoipa = { version = "6", features = ["axum_extras", "time"] }
utoipa-scalar = { version = "0.4", features = ["axum"] }
schemars = "1.2.2"
emojis = "0.9.0"
unicode-segmentation = "1.13.3"
bon = "3.10.2"

[dev-dependencies]
claxon = "0.4"
hound = "3"
